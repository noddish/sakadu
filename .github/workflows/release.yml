# v로 시작하는 태그를 푸시하면 Windows와 맥을 빌드해서 초안(draft) 릴리스 하나를 만든다. 내용을 확인한 뒤 GitHub에서 직접 게시한다.
# Actions에서 손으로 돌리면(workflow_dispatch) 두 zip을 만들어 아티팩트로만 올린다 (미리 돌려 보기: 릴리스는 만들지 않는다).
# 태그를 골라 손으로 돌리면 태그 푸시와 같다
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 빌드 작업은 읽기만 한다. 릴리스에 쓰는 권한은 release 작업에만 준다
permissions:
  contents: read

env:
  # 파일 이름에 넣는 판 이름: 태그면 태그 그대로(v0.11.0), 브랜치에서 손으로 돌리면 dry-run (브랜치 이름의 /가 파일 이름에 들지 않게)
  LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "Sakadu-$env:LABEL-windows-x64"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/release/sakadu.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # 줄 끝을 LF로 맞춰야 Linux·Git Bash의 sha256sum -c가 파일 이름을 제대로 읽는다
          "$hash  $name.zip`n" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # 맥 앱: Apple Silicon과 Intel을 함께 담은 Sakadu.app (애드혹 서명, 공증 없음: 처음 열 때 '그래도 열기'가 필요).
  # 빌드와 묶기는 CI의 mac-app 작업과 같은 명령이다
  mac:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: |
          cargo test --lib --locked
          cargo test --features mac-app --bin sakadu-mac --locked
      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --features mac-app --bin sakadu-mac --locked --target "$t"
          done
      - name: Bundle Sakadu.app
        run: bash scripts/mac-bundle.sh target dist
      # 묶은 앱이 실제로 창을 여는지 본다. 이 단계가 실패하면 릴리스를 만들지 않는다
      - name: Window snapshot from the bundle
        timeout-minutes: 3
        run: |
          mkdir -p dist/check "$RUNNER_TEMP/demo/업무"
          touch "$RUNNER_TEMP/demo/업무/회의록.md"
          dist/Sakadu.app/Contents/MacOS/sakadu-mac --snapshot dist/check/window-bundle.png --start "$RUNNER_TEMP/demo"
      - name: Package
        run: |
          name="Sakadu-${LABEL}-macos"
          ditto -c -k --keepParent dist/Sakadu.app "dist/$name.zip"
          # Windows 쪽과 같은 꼴: '<해시>  <파일 이름>' 한 줄, 줄 끝은 LF
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          cat "dist/$name.zip.sha256"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # 두 빌드가 모두 통과했을 때만, 네 파일(zip 둘과 sha256 둘)을 담은 초안 릴리스를 만든다. 태그일 때만 돈다
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-mac
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          win="Sakadu-${LABEL}-windows-x64.zip"
          mac="Sakadu-${LABEL}-macos.zip"
          # 올리기 전에 받은 파일이 해시와 맞는지 본다 (sha256 파일의 꼴도 함께 확인된다)
          (cd dist && sha256sum -c "$win.sha256" "$mac.sha256")
          gh release create "$GITHUB_REF_NAME" "dist/$win" "dist/$win.sha256" "dist/$mac" "dist/$mac.sha256" --draft --generate-notes --title "Sakadu $GITHUB_REF_NAME"
