# v로 시작하는 태그를 푸시하면 빌드해서 초안(draft) 릴리스를 만든다. 내용을 확인한 뒤 GitHub에서 직접 게시한다
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "Sakadu-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/release/sakadu.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Sakadu-${{ github.ref_name }}-windows-x64"
          gh release create "${{ github.ref_name }}" "dist/$name.zip" "dist/$name.zip.sha256" --draft --generate-notes --title "Sakadu ${{ github.ref_name }}"
