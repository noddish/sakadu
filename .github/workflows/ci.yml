name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

  # macOS 버전 준비: Win32 없는 공통 코드(src/lib.rs)가 macOS에서도 빌드·테스트되는지 본다.
  # 실행 파일(main.rs)은 아직 Windows 전용이라 --lib만 돌린다
  core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test core
        run: cargo test --lib --locked
      # 맥 시제품(sakadu-mac): 누르기 → 동작 시험, 그리고 여러 상태를 실제 맥 글꼴·그리기로 PNG에 그려 올린다
      - name: Test mac prototype
        run: cargo test --features mac-app --bin sakadu-mac --locked
      - name: Build mac prototype
        run: cargo build --features mac-app --bin sakadu-mac --locked
      - name: Render screens
        run: |
          # README 데모와 같은 한글 이름의 빈 파일 (개인 파일 없음). 날짜는 고정해 목록의 짧은 날짜가 늘 같게
          D="$RUNNER_TEMP/Sakadu 데모"
          mk() { mkdir -p "$(dirname "$D/$1")"; head -c "$2" /dev/zero > "$D/$1"; touch -t "$3" "$D/$1"; }
          mk "업무/2026 4분기/4분기_사업계획.pptx" 2516582 202610281410
          mk "업무/2026 4분기/매출_분석_10월.xlsx" 186368 202611020930
          mk "업무/2026 4분기/예산.csv" 67584 202610301120
          mk "업무/2026 4분기/제주살이_휴가.docx" 23552 202610081600
          mk "업무/2026 4분기/주간보고_11월.docx" 55296 202611031000
          mk "업무/2026 4분기/출장비_정산.xlsx" 31744 202610221500
          mk "업무/2026 4분기/회의록_11월.md" 278 202611031130
          mk "업무/문서/안내.txt" 120 202610010900
          mk "다운로드/제주 사진 원본/성산 일출 원본.jpg" 2048 202610170642
          mk "다운로드/제주살이_숙소_안내.zip" 3145728 202610091200
          mk "다운로드/제주살이_짐_체크리스트.txt" 27 202610141900
          mk "다운로드/회의자료_모음.zip" 4718592 202610291700
          touch -t 202610171800 "$D/다운로드/제주 사진 원본"
          mk "팀 공유/공지.txt" 64 202610200900
          mk "사진/제주살이/성산 일출.jpg" 1024 202610170642
          mk "사진/제주살이/맛집 메모.md" 512 202610170700
          mk "다운로드/.숨김 설정" 16 202610010900
          mkdir -p "$D/업무/빈 폴더"
          ./target/debug/sakadu-mac --render "$D" --out mac-render
          echo "DEMO=$D" >> "$GITHUB_ENV"
      # 실제 창(신호등 포함). 러너에서 창을 열 수 없으면 이 단계만 실패로 남긴다
      - name: Window snapshot
        continue-on-error: true
        timeout-minutes: 2
        run: ./target/debug/sakadu-mac --snapshot mac-render/window.png --start "$DEMO/업무"
      - name: Upload screens
        uses: actions/upload-artifact@v7
        with:
          name: mac-screens
          path: mac-render/*.png

  # 맥 시제품 앱 묶음: Apple Silicon과 Intel을 함께 담은 Sakadu.app (애드혹 서명, 공증 없음).
  # 친구 맥 확인용으로 내려받는다 (처음 열 때 '그래도 열기'가 필요)
  mac-app:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - name: Build both architectures
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --features mac-app --bin sakadu-mac --locked --target "$t"
          done
      - name: Bundle Sakadu.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP=dist/Sakadu.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/sakadu-mac" \
            target/aarch64-apple-darwin/release/sakadu-mac target/x86_64-apple-darwin/release/sakadu-mac
          lipo -archs "$APP/Contents/MacOS/sakadu-mac"
          # 아이콘: Windows 아이콘(.ico)을 PNG로 바꿔 icns로 (안 되면 아이콘 없이 묶는다)
          if sips -s format png assets/sakadu.ico --out dist/icon.png >/dev/null; then
            mkdir -p dist/AppIcon.iconset
            for s in 16 32 128 256; do
              sips -z $s $s dist/icon.png --out "dist/AppIcon.iconset/icon_${s}x${s}.png" >/dev/null
              d=$((s * 2)); sips -z $d $d dist/icon.png --out "dist/AppIcon.iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns dist/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns" || echo "icns 실패: 아이콘 없이 묶음"
          fi
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sakadu</string>
            <key>CFBundleDisplayName</key><string>Sakadu</string>
            <key>CFBundleIdentifier</key><string>io.github.noddish.sakadu</string>
            <key>CFBundleExecutable</key><string>sakadu-mac</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>GPL-3.0-or-later</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Window snapshot from the bundle
        run: |
          mkdir -p dist/check "$RUNNER_TEMP/demo/업무"
          touch "$RUNNER_TEMP/demo/업무/회의록.md"
          dist/Sakadu.app/Contents/MacOS/sakadu-mac --snapshot dist/check/window-bundle.png --start "$RUNNER_TEMP/demo"
      # Intel 쪽은 Rosetta로 실행해 본다. 러너에 Rosetta가 없으면 이 단계만 실패로 남긴다
      - name: Intel slice under Rosetta
        continue-on-error: true
        run: arch -x86_64 dist/Sakadu.app/Contents/MacOS/sakadu-mac --render "$RUNNER_TEMP/demo" --out dist/check/intel
      - name: Zip
        run: ditto -c -k --keepParent dist/Sakadu.app "dist/Sakadu-${VERSION}-mac-prototype.zip"
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Sakadu-mac
          path: dist/Sakadu-*-mac-prototype.zip
          retention-days: 30
      - name: Upload checks
        uses: actions/upload-artifact@v7
        with:
          name: mac-app-checks
          path: dist/check/
