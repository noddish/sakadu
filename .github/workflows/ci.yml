name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

  # macOS 버전 준비: Win32 없는 공통 코드(src/lib.rs)가 macOS에서도 빌드·테스트되는지 본다.
  # 실행 파일(main.rs)은 아직 Windows 전용이라 --lib만 돌린다
  core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test core
        run: cargo test --lib --locked
      # 맥 시제품(sakadu-mac): 누르기 → 동작 시험, 그리고 여러 상태를 실제 맥 글꼴·그리기로 PNG에 그려 올린다
      - name: Test mac prototype
        run: cargo test --features mac-app --bin sakadu-mac --locked
      # 파일 작업 시험을 대소문자를 가리는 볼륨에서 한 번 더 (맥 기본 볼륨은 가리지 않는다). 시험의 임시 폴더를 그 볼륨에 둔다.
      # 검색 시험도 (자모로 나뉜 한글 이름을 합친 꼴의 경로로 여는지, 그 볼륨에서도 변경 기록이 오는지).
      # 그 볼륨과 러너의 기본 볼륨 사이로 '다른 디스크로 옮기기·끌어다 놓기'도 본다 (SAKADU_TEST_OTHER_VOLUME).
      # 러너에서 디스크 이미지를 만들 수 없으면 이 단계만 실패로 남긴다
      - name: File operation tests on a case-sensitive volume
        continue-on-error: true
        run: |
          hdiutil create -size 64m -fs "Case-sensitive APFS" -volname SakaduCase "$RUNNER_TEMP/case.dmg"
          hdiutil attach "$RUNNER_TEMP/case.dmg" -mountpoint "$RUNNER_TEMP/case"
          mkdir -p "$RUNNER_TEMP/case/tmp/probe"
          touch "$RUNNER_TEMP/case/tmp/probe/a" "$RUNNER_TEMP/case/tmp/probe/A"
          test "$(ls "$RUNNER_TEMP/case/tmp/probe" | wc -l)" -eq 2
          TMPDIR="$RUNNER_TEMP/case/tmp" cargo test --lib --locked -- fileops listing pane
          mkdir -p "$RUNNER_TEMP/other-volume"
          SAKADU_TEST_OTHER_VOLUME="$RUNNER_TEMP/other-volume" TMPDIR="$RUNNER_TEMP/case/tmp" cargo test --features mac-app --bin sakadu-mac --locked -- fileops rename new_folder search another_disk
          hdiutil detach "$RUNNER_TEMP/case"
      - name: Build mac prototype
        run: cargo build --features mac-app --bin sakadu-mac --locked
      # 실제 창을 열고 키와 편집 메뉴 동작으로 폴더 감시, 이름 바꾸기, 되돌리기, 복사·붙여넣기, 휴지통, 훑어보기를 돌려 본다.
      # 임시 폴더에 시험 폴더를 만들어 그 안에서만 한다 (src/mac/view/smoke.rs)
      - name: Window smoke test
        timeout-minutes: 3
        run: ./target/debug/sakadu-mac --smoke
      - name: Render screens
        run: |
          # README 데모와 같은 한글 이름의 빈 파일 (개인 파일 없음). 날짜는 고정해 목록의 짧은 날짜가 늘 같게
          D="$RUNNER_TEMP/Sakadu 데모"
          mk() { mkdir -p "$(dirname "$D/$1")"; head -c "$2" /dev/zero > "$D/$1"; touch -t "$3" "$D/$1"; }
          mk "업무/2026 4분기/4분기_사업계획.pptx" 2516582 202610281410
          mk "업무/2026 4분기/매출_분석_10월.xlsx" 186368 202611020930
          mk "업무/2026 4분기/예산.csv" 67584 202610301120
          mk "업무/2026 4분기/제주살이_휴가.docx" 23552 202610081600
          mk "업무/2026 4분기/주간보고_11월.docx" 55296 202611031000
          mk "업무/2026 4분기/출장비_정산.xlsx" 31744 202610221500
          mk "업무/2026 4분기/회의록_11월.md" 278 202611031130
          mk "업무/문서/안내.txt" 120 202610010900
          mk "다운로드/제주 사진 원본/성산 일출 원본.jpg" 2048 202610170642
          mk "다운로드/제주살이_숙소_안내.zip" 3145728 202610091200
          mk "다운로드/제주살이_짐_체크리스트.txt" 27 202610141900
          mk "다운로드/회의자료_모음.zip" 4718592 202610291700
          touch -t 202610171800 "$D/다운로드/제주 사진 원본"
          mk "팀 공유/공지.txt" 64 202610200900
          mk "사진/제주살이/성산 일출.jpg" 1024 202610170642
          mk "사진/제주살이/맛집 메모.md" 512 202610170700
          mk "다운로드/.숨김 설정" 16 202610010900
          mkdir -p "$D/업무/빈 폴더"
          ./target/debug/sakadu-mac --render "$D" --out mac-render
          echo "DEMO=$D" >> "$GITHUB_ENV"
      # 실제 창(신호등 포함). 러너에서 창을 열 수 없으면 이 단계만 실패로 남긴다
      - name: Window snapshot
        continue-on-error: true
        timeout-minutes: 2
        run: ./target/debug/sakadu-mac --snapshot mac-render/window.png --start "$DEMO/업무"
      # 설정 창 (밝게는 검색이 꺼진 모습, 어둡게는 데모 폴더만 훑어 검색을 켠 모습)
      - name: Settings window snapshot
        continue-on-error: true
        timeout-minutes: 2
        run: |
          ./target/debug/sakadu-mac --snapshot-settings mac-render/settings-light.png --start "$DEMO/업무"
          ./target/debug/sakadu-mac --snapshot-settings mac-render/settings-dark.png --start "$DEMO/업무" --dark --search
      - name: Upload screens
        uses: actions/upload-artifact@v7
        with:
          name: mac-screens
          path: mac-render/*.png

  # 맥 시제품 앱 묶음: Apple Silicon과 Intel을 함께 담은 Sakadu.app (애드혹 서명, 공증 없음).
  # 친구 맥 확인용으로 내려받는다 (처음 열 때 '그래도 열기'가 필요)
  mac-app:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - name: Build both architectures
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --features mac-app --bin sakadu-mac --locked --target "$t"
          done
      - name: Bundle Sakadu.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP=dist/Sakadu.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/sakadu-mac" \
            target/aarch64-apple-darwin/release/sakadu-mac target/x86_64-apple-darwin/release/sakadu-mac
          lipo -archs "$APP/Contents/MacOS/sakadu-mac"
          # 아이콘: Windows 아이콘(.ico)을 PNG로 바꿔 icns로 (안 되면 아이콘 없이 묶는다)
          if sips -s format png assets/sakadu.ico --out dist/icon.png >/dev/null; then
            mkdir -p dist/AppIcon.iconset
            for s in 16 32 128 256; do
              sips -z $s $s dist/icon.png --out "dist/AppIcon.iconset/icon_${s}x${s}.png" >/dev/null
              d=$((s * 2)); sips -z $d $d dist/icon.png --out "dist/AppIcon.iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns dist/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns" || echo "icns 실패: 아이콘 없이 묶음"
          fi
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sakadu</string>
            <key>CFBundleDisplayName</key><string>Sakadu</string>
            <key>CFBundleIdentifier</key><string>io.github.noddish.sakadu</string>
            <key>CFBundleExecutable</key><string>sakadu-mac</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>GPL-3.0-or-later</string>
            <key>NSDesktopFolderUsageDescription</key><string>사카두에서 데스크탑의 파일을 보고 이름으로 찾을 수 있게 해요.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>사카두에서 문서 폴더의 파일을 보고 이름으로 찾을 수 있게 해요.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>사카두에서 다운로드 폴더의 파일을 보고 이름으로 찾을 수 있게 해요.</string>
            <key>NSFileProviderDomainUsageDescription</key><string>사카두에서 iCloud Drive의 파일을 보고 이름으로 찾을 수 있게 해요.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Window snapshot from the bundle
        run: |
          mkdir -p dist/check "$RUNNER_TEMP/demo/업무"
          touch "$RUNNER_TEMP/demo/업무/회의록.md"
          dist/Sakadu.app/Contents/MacOS/sakadu-mac --snapshot dist/check/window-bundle.png --start "$RUNNER_TEMP/demo"
      # Intel 쪽은 Rosetta로 실행해 본다. 러너에 Rosetta가 없으면 이 단계만 실패로 남긴다
      - name: Intel slice under Rosetta
        continue-on-error: true
        run: arch -x86_64 dist/Sakadu.app/Contents/MacOS/sakadu-mac --render "$RUNNER_TEMP/demo" --out dist/check/intel
      # 맥 검색 색인 측정 (참고용): 실제 폴더를 훑어 개수·시간·메모리·검색 시간만 찍는다 (파일 이름은 찍지 않는다).
      # 패키지 안까지 훑는 /Applications는 줄 수를 바꿔 가며 잰다 (첫 번은 디스크 캐시를 데우는 몫). '/'는 이름 수에 상한을 둔다.
      # 시간 제한을 넘기면 그때까지의 숫자를 찍고 끝난다. 결과는 mac-app-checks의 index-bench.txt
      - name: Index bench
        continue-on-error: true
        timeout-minutes: 15
        run: |
          B=dist/Sakadu.app/Contents/MacOS/sakadu-mac
          {
            "$B" --index-bench --time-limit 60 /Applications /System/Applications
            for t in 3 1 2 3; do "$B" --index-bench --no-skip --threads "$t" --time-limit 120 /Applications; done
            "$B" --index-bench --time-limit 180 --max-entries 3000000 /
          } 2>&1 | tee dist/check/index-bench.txt
      - name: Zip
        run: ditto -c -k --keepParent dist/Sakadu.app "dist/Sakadu-${VERSION}-mac-prototype.zip"
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Sakadu-mac
          path: dist/Sakadu-*-mac-prototype.zip
          retention-days: 30
      - name: Upload checks
        uses: actions/upload-artifact@v7
        with:
          name: mac-app-checks
          path: dist/check/

  # 맥 미리 보기: main에 합칠 때마다, 모든 작업(창 시험 포함)을 통과한 맥 앱을 '맥 미리 보기' 릴리즈에 올린다.
  # 태그 mac-preview의 pre-release라 Latest가 되지 않는다 (Windows 릴리즈와 앱의 '릴리스' 링크는 그대로).
  # 링크는 늘 같고 파일만 새 것으로 바뀐다:
  #   https://github.com/noddish/sakadu/releases/tag/mac-preview
  #   https://github.com/noddish/sakadu/releases/download/mac-preview/Sakadu-mac.zip
  # 릴리즈에 쓰는 권한은 이 작업에만 준다 (PR 빌드의 작업들은 읽기만 한다)
  mac-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, core-macos, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 잇달아 합쳐도 하나씩 올린다. 차례는 지켜지지 않아서, 옛 커밋이 새 것을 덮지 않게 올리기 전에 따로 본다
    concurrency:
      group: mac-preview
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Sakadu-mac
          path: dist
      - name: Publish to the mac-preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 이 커밋보다 새것(또는 같은 것)이 이미 올라가 있으면 그대로 둔다. 앞서 합친 것의 작업이 늦게 끝나 뒤에 올 수 있다.
          # 올린 커밋은 릴리즈 글 끝에 숨겨 적어 둔다
          published=$(gh release view mac-preview --json body --jq .body 2>/dev/null | grep -oE 'mac-preview-commit: [0-9a-f]{40}' | tail -1 | cut -d' ' -f2 || true)
          if [ -n "$published" ]; then
            order=$(gh api "repos/${GH_REPO}/compare/${published}...${GITHUB_SHA}" --jq .status 2>/dev/null || echo unknown)
            if [ "$order" = behind ] || [ "$order" = identical ]; then
              echo "mac-preview already has ${published} (this commit is ${order}). Leaving it."
              exit 0
            fi
          fi
          zip=$(ls dist/Sakadu-*-mac-prototype.zip | head -1)
          cp "$zip" dist/Sakadu-mac.zip
          (cd dist && sha256sum Sakadu-mac.zip > Sakadu-mac.zip.sha256)
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > notes.md <<EOF
          사카두 맥 미리 보기예요. main에 합칠 때마다 이 파일이 저절로 새 것으로 바뀌어요 (링크는 그대로예요).

          - **지금 파일**: main [\`${short}\`](https://github.com/${GH_REPO}/commit/${GITHUB_SHA})에서 $(date -u +%Y-%m-%d) 만들었어요. 모든 시험(실제 창 시험 포함)을 통과한 것만 올라와요.
          - **받기**: \`Sakadu-mac.zip\`을 받아 풀고 \`Sakadu.app\`을 열어요. macOS 13 이상, Apple Silicon과 Intel 맥 모두 돼요.
          - **처음 열 때**: Apple 서명이 없어서 막혀요. 시스템 설정 → 개인정보 보호 및 보안에서 **그래도 열기**를 눌러요. 새로 받을 때마다 한 번씩이에요.
          - **아직 미리 보기예요**: 파일을 만들고 바꾸는 기능은 시험용 폴더에서 먼저 써 보세요. 확인할 것은 [docs/macos-test.md](https://github.com/${GH_REPO}/blob/main/docs/macos-test.md)에 있어요.

          Windows 버전은 [Latest 릴리즈](https://github.com/${GH_REPO}/releases/latest)를 받으세요.
          EOF
          if ! gh release view mac-preview >/dev/null 2>&1; then
            gh release create mac-preview --prerelease --target "$GITHUB_SHA" --title "Sakadu 맥 미리 보기" --notes-file notes.md
          fi
          gh release upload mac-preview dist/Sakadu-mac.zip dist/Sakadu-mac.zip.sha256 --clobber
          # 커밋 표시는 두 파일을 다 올린 뒤에만 적는다. 올리다 멈췄으면 표시가 없거나 옛것이라, 다시 돌리면 다시 올린다
          printf '\n<!-- mac-preview-commit: %s -->\n' "$GITHUB_SHA" >> notes.md
          gh release edit mac-preview --prerelease --notes-file notes.md
