[package]
name = "sakadu"
version = "0.7.2"
edition = "2024"
description = "가볍고 빠른 Windows 멀티뷰 파일 관리자"
license = "GPL-3.0-or-later"

# Windows API는 Windows에서만 받는다. 공통 코드(src/lib.rs)는 다른 OS에서도 빌드·테스트된다 (macOS 버전 준비)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# COM 인터페이스 구현(#[implement])에 필요. windows가 쓰는 버전과 맞춘다
windows-core = "0.62.2"
# Direct2D DrawTextLayout의 좌표 형식. windows가 이미 쓰는 버전이라 새로 받는 것은 없다
windows-numerics = "0.3.1"

# macOS: 시간대(공통 코드의 날짜 표시)와 맥 시제품의 그리기. 맥에서만 받는다.
# 그리기 쪽 크레이트는 맥 실행 파일(mac-app 기능)을 빌드할 때만 받는다
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-core-graphics = { version = "0.3.2", optional = true }
objc2-core-text = { version = "0.3.2", optional = true }
objc2-image-io = { version = "0.3.2", optional = true }
# 뒷줄에서 읽은 폴더를 메인 줄로 돌려받는다 (objc2-core-foundation이 이미 쓰는 버전)
dispatch2 = { version = "0.3.1", optional = true }

[features]
# 맥 시제품 실행 파일(sakadu-mac). Windows 빌드에는 쓰지 않는다
mac-app = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-core-graphics", "dep:objc2-core-text", "dep:objc2-image-io", "dep:dispatch2"]

[[bin]]
name = "sakadu-mac"
path = "src/mac/main.rs"
required-features = ["mac-app"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
